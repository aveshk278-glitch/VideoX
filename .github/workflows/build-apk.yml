name: Build VideoX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # NOTE: ubuntu-latest already has the Android SDK pre-installed,
      # so no separate SDK setup step is needed. The old
      # android-actions/setup-android step was removed because it tried
      # to install the obsolete "tools" package and failed the run.

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Test and build debug APK
        # NOTE: runs unit tests first (quality selection), then the build,
        # then lint, using the installed Gradle directly (not ./gradlew)
        # because the GitHub push used for this project only carries UTF-8
        # text files, so gradle/wrapper/gradle-wrapper.jar is not in the
        # repository. The gradlew script is still in the repo for local use.
        run: gradle clean testDebugUnitTest assembleDebug lintDebug --stacktrace

      # ABI splits are enabled (arm64-v8a + armeabi-v7a) because yt-dlp +
      # FFmpeg native libraries are large; each split APK is one ABI only.
      # The artifact therefore contains two APKs — most phones use arm64-v8a.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 30
